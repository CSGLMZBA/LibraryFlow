services:
  - type: web
    name: libraryflow-api
    runtime: node
    buildCommand: npm install --include=dev && npm run build --workspace @library-flow/shared && npm run build --workspace @library-flow/backend
    startCommand: npm run start --workspace @library-flow/backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: cloud
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BOOK_BUCKET
        value: books
      - key: DELETION_WORKER_SECRET
        generateValue: true